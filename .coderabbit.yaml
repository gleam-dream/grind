# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review policy for grind, derived by the coderabbit-config skill.
# Each instruction names the skill it comes from; `policy` is the review policy
# of coderabbit-config itself, and `repository` marks a rule beyond the catalog.
#
# Catalogs read:
#   practice catalog (not public)  879841a61c3f83cd809edca9229c4a6bb7f909f8
#   gleam-agent-tools  6a9ea2f647e787a32d3c7fa88d9c58c5b81ae9d7
#
# Governing skills: coderabbit-config (policy), gleam, gleam-lib, gleam-ffi,
# grind, gleam-sql, gleam-otp, sinal, testing, python, elixir, design,
# tracker, gate, git.
#
# Governing dependency versions: grind 0.2.1 (this package, gleam.toml).
# Locked in manifest.toml: gleam_otp 1.3.0, gleam_erlang 1.3.0, pog 4.1.0,
# pgo 0.20.0, squirrel 4.7.0, cigogne 5.0.6, sinal 0.1.0, telemetry 1.4.2,
# gleam_json 3.1.0, gleam_stdlib 1.0.5, gleeunit 1.11.0. The Oban oracle is
# pinned to OSS 2.24.1 (docs/ORACLE.md, oracle/mix.lock).
language: en-US
tone_instructions: >-
  Literal and concise. Report only defects you can evidence from the diff, its
  callers, the design, or a cited rule. One finding per cause. An empty review
  is valid.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Lead with the problem the change solves, then the response in one short
    paragraph, then the public API, stored-schema or recovery effect, if any.
    Do not narrate the diff file by file.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  # Generated, rendered and locked output. sql.gleam is regenerated by
  # scripts/generate-sql.sh and checked by the database gate; review the .sql
  # files under src/grind/internal/sql instead.
  path_filters:
    - "!flake.lock"
    - "!oracle/mix.lock"
    - "!docs/design/design-layer.pdf"
    - "!src/grind/internal/sql.gleam"

  path_instructions:
    - path: "{src,consumer,examples,bench,resilience,oracle}/**"
      instructions: |
        Review policy (policy).
        - Design first. docs/COVERAGE.md maps each part to its owning section
          of docs/design/design.typ (one Durable jobs context) and to
          docs/adr. Flag code that contradicts that section's interface,
          invariants or side effects, and a change to designed behavior with
          no change to its design. A fix that restores designed behavior needs
          none. When code and design disagree, the design changes first.
        - Core abstractions. Flag a second representation of a concept the
          design names (Job, Worker, Codec, Submission key, Admission receipt,
          Claim, Attempt fence, Lease, Acknowledgement, Uncertain effect,
          Cancellation intent, Operator resolution, Declared settlement,
          Staged result), a name that differs from docs/design/CONTEXT.typ or
          uses a term it lists under "Avoid", and a public module that reaches
          into `grind/internal` past the interface that owns it.
        - Lean. Flag code no test, caller or unit needs: an unset option, an
          unvaried parameter, a wrapper that adds no rule, an unreachable
          branch. Say what to delete.
        - Migration, never a legacy path. Readable old stored jobs and
          released migration versions are designed contracts, not legacy
          paths. Outside them, flag a compatibility shim, a fallback to an old
          format, a dual read or write, a deprecated alias, and a flag that
          keeps old behavior. A change to a public module ships as a breaking
          release with a migration note.
        - Composable. In a public module (`grind`, `grind/*` outside
          `grind/internal`), flag hidden call ordering, global state, a
          mandatory framework where functions compose, a concept the common
          caller must learn and does not need, and a module with two
          responsibilities.
        - Test first. Flag a behavior change with no test that exercises it,
          and a test bound to internals.
        - Typed before foreign. Flag Erlang where Gleam does the job, an
          unchecked cast, an untyped value that reaches domain logic
          undecoded, and a crash on a routine failure.
        - Silence. Report nothing that `nix fmt`, the compiler, the tests,
          scripts/ci.sh or scripts/test-postgres.sh decide, and no layout or
          naming preference without a written rule.

    - path: "{src,test,consumer,examples,bench,resilience}/**/*.gleam"
      instructions: |
        Gleam (gleam).
        - Flag a module function, private included, without annotated
          arguments and return type, and an imported function or constant used
          unqualified.
        - Flag a name against the conventions: `Json` not `JSON`,
          conversions named `x_to_y` or `to_y` inside module `x`, `try_` only
          for an error-propagating counterpart.
        - Flag `Option` carrying a failure, and a change that merges omitted,
          explicit false, empty and failed where they mean different things.
        - Flag an error a caller must parse as a string to choose recovery.
        - Flag independent optional fields or booleans standing for exclusive
          states; they are variants.
        - Flag a predicate check followed by `let assert` on the same shape,
          and a catch-all branch that silently accepts a new variant of a job
          state, outcome or error kind.
        - Flag `panic` or `let assert` handling a routine database or decode
          failure in `src/`.
        - Flag a refactor that changes observable errors, ordering or effects.
        - Flag a compatibility branch with no comment saying why it exists.
        - Flag `src/` importing a `test/` module, `gleeunit`, or a
          dev-dependency (`squirrel`, `simplifile`, `cigogne`).
        - Flag a new process, module or generic machinery added only for
          organization, and a local type replacing a compatible ecosystem type.

    - path: "src/**/*.gleam"
      instructions: |
        Published library surface (gleam-lib). Exported constructors, fields,
        variants, module paths and behavior of `grind` and `grind/*` outside
        `grind/internal` are the compatibility surface; `grind/internal`
        marks instability, not access control.
        - Flag a removed or changed export, variant, field or behavior in a
          public module that the pull request does not call breaking.
        - Flag a public signature that exposes an implementation-state type
          parameter.
        - Flag an argument that does not affect behavior, a bound worker or
          operation that makes callers repeat its identity or codecs at each
          use, a setter per field where a record update works, and two public
          paths for one common task.
        - Flag configuration validated after the pool, consumers or renewal
          pools are allocated.
        - Flag a builder or extension protocol with no distinct use case, and
          a dynamic dispatcher over heterogeneous workers where typed
          operations can be bound.
        - Flag a deliberate crash on a failure the caller could act on; return
          a structured error instead.
        - Flag the library taking over policy that belongs to the application:
          business idempotency, codec compatibility across versions, effect
          investigation, authorization (AGENTS.md: caller-owned worker, codec
          and error boundaries).
        - Flag a new value sent between processes per job or per call with no
          bound on its copy size (copy cost; gleam-otp).

    - path: "{src,test,consumer,examples,bench,resilience}/**/*.{gleam,erl}"
      instructions: |
        Foreign boundaries (gleam-ffi). Apply to `*.erl` files and to a Gleam
        module that declares `@external`.
        - Flag validation, branching, retries or state transitions in Erlang;
          it performs the native call and the representation conversion only.
        - Flag an external that declares a native value to be a checked domain
          value, `Dynamic` or a type variable that accepts every handle, and a
          generic return that hides an unchecked cast.
        - Flag Erlang that builds a Gleam `Result` or variant with a shape the
          compiler does not generate for it.
        - Flag an expected native failure not mapped to the declared failure
          value, and code that assumes Gleam catches an Erlang exception.
        - Flag a change to `grind_postgres_ffi.erl` or `grind_pool_ffi.erl`
          that depends on another private pog or pgo shape without the review
          the gleam.toml comment asks for.
        - Flag a timeout or cancellation read as proof that the native effect
          did not happen.
        - Flag a foreign function with no remaining caller.

    - path: "gleam.toml"
      instructions: |
        Driver pins (gleam-ffi; gleam.toml).
        - Flag a widened `pog` or `pgo` range with no review of the private
          driver contracts that `grind_postgres_ffi.erl` and
          `grind_pool_ffi.erl` match, and of the startup and reconnect
          regressions, as the comment above the pins asks;
          `pog_connection_pool_shape_test` alone does not cover them.

    - path: "src/**/*.gleam"
      instructions: |
        Grind runtime contracts (grind; rules for 0.2.1).
        - Flag a staged reply from `submit_in` or `admin.resolve_uncertain_in`
          returned, logged or documented as proof of the caller's commit
          (ADR-0004, ADR-0013).
        - Flag code that turns an `Uncertain` job into replay, failure or
          success because a process died or a lease expired, other than the
          worker's declared abandonment policy or an attributed resolution
          (ADR-0006, ADR-0012, ADR-0021).
        - Flag cancellation intent that permits replay authorization, and
          cancellation treated as proof that no effect happened.
        - Flag a lifecycle, recovery or admission decision taken from a Sinal
          observation; observations are best effort (ADR-0009).
        - Flag a uniqueness window or admission receipt presented as a
          permanent business ledger, and pruning that keeps receipts past
          their job.
        - Flag a local queue capacity presented as a cluster-wide limit.
        - Flag a per-job message, spawn closure or start argument that carries
          the worker definition, registry or runtime environment where an id
          or the handler alone serves.
        - Flag a codec or worker-version change that leaves stored jobs of a
          deployed version unreadable.
        - Flag documentation or an API that promises cron, batch coordination
          or dependency workflows the code does not implement.

    - path: "{consumer,examples,bench,resilience}/**/*.gleam"
      instructions: |
        Grind consumers (grind; rules for 0.2.1). Apply to a module that
        imports `grind`.
        - Flag a new submission key after a timeout or `CommitUnknown`; retain
          the `PendingSubmission` and call `grind.reconcile_submission`.
        - Flag one submission key reused for a different command.
        - Flag `grind.submit_in` given a connection other than the caller's
          open READ COMMITTED transaction connection in the same database,
          and its error replaced by success instead of propagated to the
          transaction owner.
        - Flag the `submit_in` or `admin.resolve_uncertain_in` reply treated
          as the business commit; only the outer commit settles it.
        - Flag investigation of an uncertain job run inside the transaction
          that holds the resolution locks.
        - Flag `Uncertain` work replayed without an attributed
          `admin.resolution`, and cancellation used to settle uncertainty.
        - Flag `grind.await` returning `Pending` treated as cancellation or
          failure.
        - Flag an effectful handler with no application idempotency key that
          the provider enforces.
        - Flag a worker handler closure that captures an environment,
          catalogue, agent or other large value; capture ids.
        - Flag a script-owned `grind.start` with no matching `grind.stop`, and
          an application runtime not placed under its supervision tree with
          `grind.supervised`.
        - Flag a changed worker codec or callback meaning with no worker
          version change while stored jobs of the old version can exist.
        - Flag retention configured shorter than the window in which the
          application relies on submission recovery or deduplication.

    - path: "{src,consumer,examples,bench,resilience}/**/*.gleam"
      instructions: |
        PostgreSQL access (gleam-sql; rules for pog 4.1.0, squirrel 4.7.0,
        cigogne 5.0.6). Apply to a module that imports `pog`.
        - Flag a query run on the pool inside a transaction callback instead
          of the callback's transaction connection.
        - Flag a caller-controlled identifier or value interpolated into SQL
          text; bind values as parameters and select identifiers, such as the
          installation schema (ADR-0017), from a checked value.
        - Flag an `Error` after a write treated as proof that no write
          happened, and a decode failure after a write that is not propagated
          through the transaction.
        - Flag `numeric` decoded as `Float` where the value is exact, and
          JSON or JSONB text reaching domain logic without decoding.
        - Flag an empty string silently converted to null.
        - Flag a database invariant enforced only by an application check
          where concurrent writers can interleave; use a constraint or a lock.
        - Flag a static, parameter-only statement added inline in
          `grind/internal/postgres` or its collaborators; it belongs in its
          own `.sql` file under `src/grind/internal/sql` (AGENTS.md,
          ADR-0014). Dynamic SQL stays inline.

    - path: "src/grind/internal/sql/*.sql"
      instructions: |
        Query files (gleam-sql; squirrel 4.7.0).
        - Flag a file that holds more than one statement.

    - path: "{priv/migrations/*.sql,src/grind/internal/migrations.gleam}"
      instructions: |
        Migrations (gleam-sql; AGENTS.md "Adding a migration", ADR-0015,
        ADR-0016).
        - Flag an edit to an existing migration file; applied history changes
          by a new `<timestamp>-grind_v<N>.sql` file.
        - Flag a new migration file that does not start with the advisory-lock
          statement, does not end its version statements with the marker
          insert, or lacks a real reverse-order `down` section.
        - Flag a new migration with no matching `Migration(<N>, ...)` entry in
          `migrations()`, or one whose statements differ from the file's `up`
          section, or whose `shape` and `foreign_keys` are not complete and
          cumulative.
        - Flag a transaction option that breaks the claim that a migration
          commits atomically.

    - path: "{src,consumer,examples,bench,resilience}/**/*.gleam"
      instructions: |
        Processes (gleam-otp; rules for gleam_otp 1.3.0, gleam_erlang 1.3.0).
        Apply to a module that imports `gleam/otp` or `gleam/erlang/process`.
        - Flag `process.call` whose timeout or callee exit is handled as a
          returned error or as proof the request had no effect, and a call
          timeout that triggers an unconditional retry of an effect.
        - Flag a database or network call inside a coordinator that must stay
          responsive to cancellation, renewal or settlement messages.
        - Flag a subject received from outside its owning process.
        - Flag accepted work, active attempts or waiting messages with no
          bound.
        - Flag a process name or atom created from runtime input; allocate a
          bounded set at startup.
        - Flag a supervisor strategy that does not match the children's
          dependency (`RestForOne` when later children depend on earlier),
          and a dependant that keeps an unusable handle after a restart.
        - Flag a spawn closure, message or start argument that captures a
          whole environment, worker set or codec catalogue; capture small
          references and keep static data in module constants or
          `persistent_term`.
        - Flag an actor introduced only to organize functions.

    - path: "{src,test,consumer,examples}/**/*.gleam"
      instructions: |
        Telemetry (sinal; rules for sinal 0.1.0, telemetry 1.4.2). Apply to a
        module that imports `sinal`.
        - Flag an event name, field key or route prefix built from runtime
          input; put unbounded values in metadata values.
        - Flag a custom getter or encoder that can fail or raise in the
          emitting process.
        - Flag an enum field codec whose list misses a constructor.
        - Flag a handler that writes to the database or calls the network on
          a hot path, and an attachment a test or request scope does not
          detach.
        - Flag telemetry used to decide whether a business commit happened,
          and forwarding treated as lossless or as draining on shutdown.

    - path: "{test,consumer/test,examples/usage/test,bench/test}/**"
      instructions: |
        Tests (testing).
        - Flag a test that confirms success through internals, private state,
          table queries or a side channel where the public API can show it.
        - Flag a mock of an internal collaborator, and an assertion on call
          counts or call order.
        - Flag a scenario outcome that no design rule states.
        - Flag tests left in place for an interface the diff replaced.
        - Flag a refusal or illegal transition the change introduces with no
          test through the public boundary.
        - Flag a transaction, constraint, lock or migration behavior tested
          against a stand-in instead of PostgreSQL.
        - Flag a new storage, renewal, acknowledgement or resolution path with
          no test of timeout, retry, duplicate delivery or restart where the
          design states its outcome.

    - path: "{bench,oracle,resilience,scripts}/**/*.py"
      instructions: |
        Python harnesses and scripts (python).
        - Flag `Any`, and an external value (file, JSON, process output) used
          without parsing.
        - Flag an abstract base class hierarchy; use `Protocol`.
        - Flag mutable dataclasses inside the program, and exclusive states as
          flags instead of tagged frozen dataclasses matched with
          `assert_never`.
        - Flag a parser model passed past the boundary.

    - path: "oracle/**/*.{ex,exs}"
      instructions: |
        Oban oracle (elixir).
        - Flag a conditional in a function body where matching in the
          function head selects the behavior.
        - Flag a bare `nil` returned beside tagged results, and an expected
          failure not returned as `{:error, reason}`.
        - Flag a `rescue` of an error the caller cannot handle.
        - Flag an atom created from scenario input or other external text.
        - Flag `@enforce_keys` relied on as validation.
        - Flag a process started to decide what a pure function can.
        - Flag `async: false` with no named process, global configuration or
          timing reason.

    - path: "docs/{design,adr}/**"
      instructions: |
        Design layer (design; policy).
        - Fresh reader. The reviewer never saw the change being made. Flag a
          changed unit that does not tell a reader with no memory what the
          code does not say, and a unit that copies the code.
        - Flag content the code states: payloads, fields, limits, timeouts,
          retries, function or file lists, queries. Name the rule it serves
          instead; a file or symbol is allowed only where a reader needs it to
          find where a rule is enforced.
        - Flag session narration, progress notes, status or delivery history.
        - Flag a unit missing one of overview, interface, invariants, side
          effects and verification; an empty part says "none".
        - Flag a concept defined in a second home, a glossary term with two
          meanings, and a retired term reused.
        - Flag an edit to an accepted ADR's text instead of a superseding ADR,
          and a changed date on a pending entry.

    - path: "issues/**/*.md"
      instructions: |
        Local tracker (tracker; AGENTS.md).
        - Each issue file carries one `Status:` and one `Category:` header
          with a value AGENTS.md lists.
        - Flag an issue titled with a solution instead of the observable
          problem, line numbers or solution code in an issue, and a horizontal
          task such as "build the data layer".
        - Flag an AI-written comment that does not start with
          `AI-assisted contribution.`

    - path: "{scripts/**,oracle/*.sh,flake.nix,lefthook.yml,.github/**}"
      instructions: |
        Gate (gate).
        - Flag a check that passes or skips when its tool or database is
          missing; it fails or reports unmeasured. `gleam test` skipping
          database cases is designed only because scripts/test-postgres.sh
          runs them.
        - Flag a tool not supplied through the Nix flake, and a command that
          differs between local runs and CI.
        - Flag a new check that encodes a layout, naming or README
          convention, and a check that scripts what a tool already performs.
        - Flag a replaced check that drops security or data-integrity
          coverage, such as the Squirrel check, the migration conformance pins
          or the paired oracle scenarios.
        - Flag a gate that keeps a formatting check but loses compile or
          behavior tests for the root, consumer or examples/usage.

    - path: ".github/workflows/pr-title.yml"
      instructions: |
        Pull request title check (gate).
        - This file mirrors the shared title workflow. Flag a change that
          makes it differ from the shared copy: types, patterns, action pin,
          triggers or permissions.
        - It is the one convention CI checks, so do not flag it as a
          convention turned into a check.
        - Its tool is the pinned action in place of a flake tool, because the
          title exists on the pull request and never in a checkout.

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: No weakened test or gate
        mode: error
        instructions: |
          Source: policy, gate. Fail if the diff skips, deletes, disables or
          loosens a test, an oracle or fault scenario, a released migration
          sha256 pin, or a step of scripts/ci.sh, scripts/test-postgres.sh or
          CI (including removing a project from a test run, removing an entry
          from oracle/scenarios.json or oracle/fault-scenarios.json, or adding
          `continue-on-error`), and the pull request description does not name
          the behavior that no longer exists or the stronger check that
          replaces it. Pass otherwise.
      - name: Behavior change carries its design
        mode: warning
        instructions: |
          Source: policy, design. Warn if the diff changes public behavior, an
          invariant, the stored schema or a recovery contract in src/ or
          priv/migrations with no change under docs/design or docs/adr, and
          the pull request description does not say the change restores
          designed behavior or preserves behavior. Pass for tests, tooling and
          documentation-only changes.
      - name: Breaking change is declared
        mode: warning
        instructions: |
          Source: policy, gleam-lib. Warn if the diff removes or changes an
          exported function, type, constructor, field or module path in
          `grind` or a `grind/*` module outside `grind/internal`, and the pull
          request description does not call the change breaking and give its
          migration. Pass otherwise.
      - name: Problem-first description
        mode: warning
        instructions: |
          Source: git. Warn unless the pull request description gives the
          problem, why it matters, one concrete example, the solution in one
          paragraph, its trade-offs, and what was verified, with no file
          tour, and its claims match the diff.
      - name: No attribution text
        mode: warning
        instructions: |
          Source: git. Warn if the pull request title or description contains
          a co-author credit, `Co-Authored-By`, a "Generated with" or
          "Generated by" line, or a line starting with the robot emoji.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # The repository does not run actionlint.
    actionlint:
      enabled: false
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    # The repository runs no SQL, prose or YAML linter and no second Python
    # linter; their findings would be preferences without a written rule
    # (policy, Silence). Migration safety is checked by the conformance tests.
    sqlfluff:
      enabled: false
    squawk:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - files: "docs/COVERAGE.md,docs/design/*.typ,docs/adr/*.md"
        applyTo: "src/**,priv/**,test/**,consumer/**,examples/**,bench/**,resilience/**,oracle/**"
      - files: "docs/ORACLE.md,oracle/ORACLE-LEDGER.md"
        applyTo: "oracle/**,scripts/**"
      - files: "docs/BENCHMARKS.md,bench/README.md,resilience/README.md"
        applyTo: "bench/**,resilience/**,scripts/**"
  learnings:
    scope: local
  pull_requests:
    scope: local
