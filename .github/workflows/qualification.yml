name: Qualification
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: ${{ matrix.profile }} evidence
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: [matrix, soak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: grind
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: ./grind/.github/actions/dependencies
        with:
          scope: ${{ matrix.profile }}
          projects: |
            .
            consumer
            examples/usage
            bench
            resilience
      - name: Cache isolated Mix downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/grind-dependencies/hex/packages
            ${{ runner.temp }}/grind-dependencies/mix/archives
          key: mix-archives-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('grind/oracle/mix.lock', 'grind/flake.lock') }}
      - name: Scheduled evidence and retained audit checks
        working-directory: grind
        env:
          PROFILE: ${{ matrix.profile }}
        run: GRIND_CI_CACHE="$RUNNER_TEMP/grind-dependencies" CI_ARTIFACT_DIR="$RUNNER_TEMP/grind-qualification" nix develop --command bash scripts/ci.sh "$PROFILE"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grind-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grind-qualification
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
  qualification-status:
    name: Qualification
    if: always()
    needs: [qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.qualification.result }}
        run: '[[ "$RESULT" == success ]]'
