name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: grind
          persist-credentials: false
      - name: Read immutable sibling revision
        id: revisions
        working-directory: grind
        run: |
          sinal="$(sed -n 's/^sinal=//p' sibling-revisions.txt)"
          [[ "$sinal" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid Sinal revision' >&2; exit 1; }
          echo "sinal=$sinal" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gleam-dream/sinal
          ref: ${{ steps.revisions.outputs.sinal }}
          path: sinal
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Canonical formatting
        working-directory: grind
        run: nix flake check
      - name: Complete ordinary gate
        working-directory: grind
        run: CI_ARTIFACT_DIR="$RUNNER_TEMP/grind-ci" nix develop --command bash scripts/ci.sh full
      - name: Sinal's own test suite
        working-directory: sinal
        run: nix develop --command gleam test
      - name: Preserve evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grind-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grind-ci
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  design:
    name: Design layer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix run .#design-gate-check -- docs/design .

  ci:
    name: CI
    if: always()
    needs: [validation, design]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          VALIDATION: ${{ needs.validation.result }}
          DESIGN: ${{ needs.design.result }}
        run: |
          [[ "$VALIDATION" == success && "$DESIGN" == success ]] || exit 1
