name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: grind
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: ./grind/.github/actions/dependencies
        with:
          scope: validation
          projects: |
            .
            consumer
            examples/usage
            bench
            resilience
      - name: Cache isolated Mix downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/grind-dependencies/hex/packages
            ${{ runner.temp }}/grind-dependencies/mix/archives
          key: mix-archives-v1-${{ runner.os }}-validation-${{ hashFiles('grind/oracle/mix.lock', 'grind/flake.lock') }}
      - name: Canonical formatting
        working-directory: grind
        run: nix flake check
      - name: Shared design validation
        working-directory: grind
        run: nix run .#design-gate-check -- docs/design .
      - name: Complete ordinary gate
        working-directory: grind
        run: GRIND_CI_CACHE="$RUNNER_TEMP/grind-dependencies" CI_ARTIFACT_DIR="$RUNNER_TEMP/grind-ci" nix develop --command bash scripts/ci.sh full
      - name: Preserve evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grind-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grind-ci
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  ci:
    name: CI
    if: always()
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          VALIDATION: ${{ needs.validation.result }}
        run: |
          [[ "$VALIDATION" == success ]] || exit 1
