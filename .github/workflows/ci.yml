name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: neither job needs to write to the repository, open
# issues/PRs, or touch packages — narrowing this closes off a whole class of
# supply-chain risk (a compromised action in the dependency graph gaining
# write access) at zero functional cost.
permissions:
  contents: read

# Every job below checks out `gleam-dream/sinal` as a sibling directory of
# this repo's own checkout (`../sinal`, relative to `grind/`): `gleam.toml`
# depends on it as a local path dependency (`sinal = { path = "../sinal" }`),
# not a Hex package, so `gleam deps download`/`gleam build` cannot resolve at
# all without it — this is required just to compile, independent of whether
# any PostgreSQL-backed test ever runs. Pinned to a fixed commit, not a
# branch, so a later `sinal` change can never silently break this repo's own
# CI without a deliberate bump here. See README, and
# `docs/RELEASE-READINESS.md`, "CI", for why this pin exists and how to
# update it.
#
# `gleam-dream/sinal` must be a *public* repository for this checkout to
# succeed with no credentials at all (the default `GITHUB_TOKEN` a workflow
# run gets can never read a different, private repository); if it is ever
# made private, this step needs a token with read access to it supplied
# explicitly (`actions/checkout`'s own `token:` input), not just this
# workflow's ambient permissions.
env:
  SINAL_REF: 44c5395938ce6da85378c475d8695f0ede492631

jobs:
  # Fast feedback: format, compile (both the root package and the external
  # `consumer/` package that exercises Grind's own public API from outside
  # the package boundary), and the plain `gleam test` run — every
  # PostgreSQL-backed test under `test/` short-circuits to a
  # no-op here (its own `case database_url() { Error(Nil) -> Nil ... }`
  # guard, since no `GRIND_TEST_*_URL` environment variable is set), so a
  # green run here only proves the code compiles and the DB-independent unit
  # tests pass — never that the real system works. `postgres-gate` below is
  # what actually exercises PostgreSQL-backed behavior; this job exists only
  # to fail fast on a compile/format error without waiting on that heavier
  # job's own Postgres/Elixir bootstrap.
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grind
      - uses: actions/checkout@v4
        with:
          repository: gleam-dream/sinal
          ref: ${{ env.SINAL_REF }}
          path: sinal
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3.27.0"
      - working-directory: grind
        run: gleam deps download
      - working-directory: grind
        run: gleam format --check src test
      - working-directory: grind
        run: gleam build --warnings-as-errors
      - working-directory: grind
        run: gleam test
      - working-directory: grind/consumer
        run: gleam deps download
      - working-directory: grind/consumer
        run: gleam build --warnings-as-errors

  # The real gate: the same disposable-PostgreSQL-cluster script the local
  # development workflow runs (`scripts/test-postgres.sh`), through the
  # identical Nix dev shell (`flake.nix`) rather than a hand-rolled
  # reconstruction of its toolchain — so CI exercises literally the same
  # PostgreSQL 16, Erlang/OTP, Gleam, and Elixir (for the pinned Oban oracle
  # harness under `oracle/`) versions a contributor's own `nix develop`
  # would. `scripts/test-postgres.sh` itself already fails closed if any
  # named integration contract's own marker never got written (the
  # `for contract in ...; do if ! grep -q "$contract" ...; then exit 1;
  # fi; done` checklist for both the root suite and the external `consumer/`
  # suite) — a DB-backed test silently short-circuiting the way it can in
  # `quick-check` above therefore fails this job outright here, by design,
  # rather than passing green with less coverage than it looks like.
  postgres-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grind
      - uses: actions/checkout@v4
        with:
          repository: gleam-dream/sinal
          ref: ${{ env.SINAL_REF }}
          path: sinal
      - uses: cachix/install-nix-action@v31
      # Caches the Nix store itself (every derivation `nix develop`/
      # `nix flake check` build or fetch — nixpkgs, the dev shell's own
      # closure) across runs, independent of the `actions/cache` below,
      # which only ever covered this repo's own Gleam/Mix build artifacts.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # `scripts/test-postgres.sh` runs `gleam clean` (both `grind/` and
      # `grind/consumer/`) as its own first step — a guard against a stale
      # `build/` directory silently reusing a dependency source the current
      # manifest no longer resolves (see the script's own comment) — so
      # caching either `build/` directory here would only ever cache a
      # tree this same job immediately discards; keeping them cached wasted
      # cache space and cache-restore time for zero benefit every run. Only
      # `sinal/build` (never `gleam clean`ed by this workflow) and the
      # Elixir oracle's `deps`/`_build` (Mix does its own incremental
      # recompilation, unlike `gleam clean`'s unconditional wipe) are
      # actually worth restoring. Keyed precisely on this run's own
      # manifest/lock hashes, with no broad `restore-keys` prefix: a
      # same-OS, different-hash fallback would restore a stale `sinal/build`
      # or oracle `_build` built against different dependency versions than
      # this run actually resolves, which is worse than a clean rebuild.
      - uses: actions/cache@v4
        with:
          path: |
            grind/oracle/deps
            grind/oracle/_build
            sinal/build
          key: ${{ runner.os }}-grind-${{ hashFiles('grind/oracle/mix.lock', 'sinal/manifest.toml') }}
      - name: nix flake check (grind)
        working-directory: grind
        run: nix flake check
      # Sinal's own test suite — `docs/RELEASE-READINESS.md`'s own
      # packaging checklist has long named this as a CI goal alongside the
      # PostgreSQL gate. Sinal owns its own `flake.nix`, so this uses that
      # devShell (its own pinned toolchain), not grind's — Sinal has no
      # database dependency, so this is fast and fails independently of the
      # PostgreSQL gate below.
      - name: Sinal's own test suite
        working-directory: sinal
        run: nix develop --command gleam test
      - name: PostgreSQL gate (root suite, consumer/ suite, pinned Oban oracle, Squirrel check)
        working-directory: grind
        run: nix develop --command bash scripts/test-postgres.sh
